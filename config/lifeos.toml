# LifeOS configuration — the single source of truth for structure and vocabulary.
#
# Everything mechanical reads this file: the linter, the CLI, the write guard, the
# generated indexes, and `docs/schema.md` (which is generated from it — run
# `python3 scripts/vault.py docs` after any edit here).
#
# Routine customization means editing THIS file, never framework internals.
# After changing anything, run:  python3 scripts/vault.py docs && python3 scripts/vault.py check
#
# Format is TOML (Python 3.11+ stdlib `tomllib`). See docs/customization.md.

# ─────────────────────────────────────────────────────────────── identity

[vault]
# Shown in generated headers and the dashboard. Also the Obsidian vault name used
# by `obsidian://` capture URLs.
name = "LifeOS"

# Language for every compiled artifact (wiki pages, outputs, project notes).
# Sources in other languages keep their original body plus a translation section.
# ISO 639-1 code; "en" | "de" | "ja" | ... — this is a label, not a translator.
primary_language = "en"

# Prefix for every environment variable this framework reads
# (LIFEOS_ALLOW_SYSTEM_WRITES, LIFEOS_INDEX_DIR, LIFEOS_FETCH_*).
env_prefix = "LIFEOS"

# ─────────────────────────────────────────────────────────────── vocabulary

[vocab]
# The ONE axis all automation groups by. Every project, area, and wiki page picks
# exactly one. Keep this list short (6-12); it is a filing axis, not a tag cloud.
# Renaming a value here means renaming it in your notes too — `vault check` will
# tell you exactly which files still use the old value.
domains = [
  "career",       # work, role, craft
  "engineering",  # how things are built
  "finance",      # money, investing, planning
  "health",       # body, mind, energy
  "learning",     # study, skills, research
  "personal",     # relationships, home, life admin
  "projects",     # side work, ventures, building
  "world",        # everything you follow but do not act on
]

# Reserved for the generated index files. Do not use it on your own notes.
meta_domain = "meta"

# Suggested starting tags. Tags are free-form lowercase-kebab with no `#`; this
# list only seeds autocomplete and documentation. `domain` is what automation uses.
suggested_tags = [
  "mental-model", "technique", "strategy", "reference", "question", "idea",
]

# ─────────────────────────────────────────────────────────────── cadence

[review]
# Weekly is the only scaffolded review. See docs/decisions.md (ADR-011) before
# adding monthly or quarterly notes — the answer is usually a new section in the
# weekly template, not a new note type.
cadence = "weekly"

# An active project untouched this long is flagged by `vault status`.
stale_active_days = 30
# An idea this old is flagged for activate-or-delete.
stale_idea_days = 90
# A decision this old with `outcome: unknown` is flagged for outcome review.
decision_review_days = 14
# A wiki page not corroborated in this long shows up in `vault doctor`.
stale_wiki_days = 365

# ─────────────────────────────────────────────────────────────── paths

[paths]
# Folders agents may write to. The PreToolUse write guard enforces exactly this
# list; everything else in the repo is system surface and requires a human.
content_dirs = [
  "inbox", "daily", "areas", "projects", "people",
  "meetings", "raw", "wiki", "outputs", "logs", "attachments",
]

# Root-level files agents may write (generated dashboard).
content_root_files = ["Home.md"]

# Folders excluded from linting and link checking (system, not content).
system_dirs = [
  "config", "docs", "scripts", "templates", "bases", "examples",
  ".claude", ".githooks", ".github", ".obsidian",
]

# Files regenerated by `vault index`. Never hand-edit; `vault check` fails when stale.
generated_files = [
  "Home.md", "projects/_index.md", "wiki/_index.md",
]

# Per-domain wiki router pages, generated under this folder (one file per domain).
wiki_domain_dir = "wiki/domains"

# ─────────────────────────────────────────────────────────────── field rules

[fields]
# Quoted YAML strings: "YYYY-MM-DD". Bookkeeping stamps on evergreen notes.
dates_quoted = ["created", "updated", "last_corroborated"]
# Unquoted YAML dates: YYYY-MM-DD. The real-world date of a dated thing.
dates_unquoted = ["date", "due", "review_on"]
# YAML lists of quoted wikilinks: - "[[Title]]". Resolved by basename, never path.
link_lists = ["projects", "areas", "people", "sources", "sources_consulted", "related"]
# Single quoted wikilinks: "[[Title]]".
link_scalars = ["entity"]

# ─────────────────────────────────────────────────────────────── note types
#
# Each [types.X] block defines one note type. `type` in frontmatter and the folder
# must agree — that is the invariant the whole system rests on.
#
# filename = how files in this folder are named:
#   title    Title.md                      (evergreen)
#   dated    YYYY-MM-DD Title.md           (a thing that happened)
#   daily    YYYY/MM/YYYY-MM-DD.md         (one per day)
#   week     YYYY-Www.md                   (one per ISO week)
#   log      YYYY-MM-DD-<run_type>.md      (one per agent run)
#   capture  YYYY-MM-DD HHmm Title.md      (fast capture)
#   free     anything                      (unstructured)
#
# required   = must be present. An empty list still counts as present, so a new
#              note can be created before you have filled in its links.
# non_empty  = must also have a value. Use sparingly: it is friction at creation
#              time, and only pays off where an empty field makes the note a lie.

[types.inbox]
folder = "inbox"
filename = "capture"
template = "inbox.md"
frontmatter_optional = true          # captures from a phone have no frontmatter
required = ["type"]
optional = ["date", "tags", "source_url"]
summary = "Unprocessed capture. Steady state: empty."

[types.daily]
folder = "daily"
filename = "daily"
template = "daily.md"
required = ["type", "date", "tags"]
optional = ["aliases"]
summary = "One day of tasks, log lines, and links. A scratchpad, not a task system."

[types.area]
folder = "areas"
filename = "title"
template = "area.md"
required = ["type", "title", "status", "created", "updated", "domain", "tags"]
optional = ["aliases", "related"]
summary = "A standing responsibility with no end date. Keep under ~10."
[types.area.enums]
status = ["active", "dormant"]

[types.project]
folder = "projects"
filename = "title"
template = "project.md"
archive_folder = "projects/archive"   # status `archived` <=> lives here
archive_status = "archived"
required = ["type", "title", "status", "created", "updated", "domain", "question", "tags"]
optional = ["kind", "areas", "due", "aliases", "people"]
summary = "An outcome with a defined end state."
[types.project.enums]
status = ["idea", "active", "paused", "done", "archived"]
kind = ["research", "build", "learning", "life"]

[types.person]
folder = "people"
filename = "title"
template = "person.md"
required = ["type", "title", "created", "updated", "tags"]
optional = ["relation", "org", "entity", "projects", "areas", "aliases"]
summary = "Someone you actually interact with. People you only read about are wiki entities."
[types.person.enums]
relation = ["colleague", "friend", "family", "mentor", "contact"]

[types.meeting]
folder = "meetings"
filename = "dated"
template = "meeting.md"
required = ["type", "title", "date", "people", "tags"]
non_empty = ["people"]                # a conversation has participants
optional = ["projects", "areas", "aliases"]
summary = "A record of one conversation."

[types.source]
folder = "raw"
filename = "dated"
immutable = true                      # bodies are written once, never edited
variant_field = "source_type"
required = ["type", "source_type", "title", "author", "date", "tags"]
optional = ["url", "publisher", "projects", "aliases"]
summary = "Third-party content, captured verbatim. Append-only."
# `url` is required only for the variants that come from the web — a book or your
# own written-up thinking has no permalink, and demanding one would force a lie.

# Ingestion is an interface, not a fixed list. Each variant adds one `source_type`
# value and one folder under raw/. Adding a source type is a config edit; adding a
# *pipeline* for it is a skill. See docs/ingestion.md.
[types.source.variants.article]
folder = "raw/articles"
template = "source.md"
required = ["url"]
non_empty = ["url"]
summary = "Any public web page worth keeping."

[types.source.variants.paper]
folder = "raw/papers"
template = "source.md"
url_hints = ["arxiv.org", "doi.org", ".pdf"]
required = ["url", "publisher"]
non_empty = ["url", "publisher"]
summary = "An academic or technical paper."

[types.source.variants.video]
folder = "raw/videos"
template = "source.md"
url_hints = ["youtube.com", "youtu.be"]
required = ["url"]
non_empty = ["url"]
summary = "A talk or video, captured as a transcript summary."

[types.source.variants.repo]
folder = "raw/repos"
template = "source.md"
url_hints = ["github.com", "gitlab.com"]
required = ["url"]
non_empty = ["url"]
summary = "A codebase worth understanding."

[types.source.variants.book]
folder = "raw/books"
template = "source.md"
summary = "Notes and excerpts from a book."

[types.source.variants.note]
folder = "raw/notes"
template = "source.md"
summary = "Pasted text, a conversation excerpt, or your own written-up thinking."

[types.wiki]
folder = "wiki"
filename = "title"
required = ["type", "title", "created", "updated", "sources", "domain", "tags"]
non_empty = ["sources"]               # a wiki claim without provenance is a guess
optional = ["projects", "aliases", "last_corroborated", "disputed", "related"]
summary = "Compiled knowledge. Upserted, never duplicated, always cited."
# No variant_field: for wiki pages the folder alone says what kind of page it is.
# `vault.py new concept "Title"` files it correctly.

[types.wiki.variants.concept]
folder = "wiki/concepts"
template = "wiki-concept.md"
summary = "An idea, model, or definition worth reusing."

[types.wiki.variants.entity]
folder = "wiki/entities"
template = "wiki-entity.md"
summary = "A company, person, product, or protocol you keep encountering."

[types.wiki.variants.technique]
folder = "wiki/techniques"
template = "wiki-technique.md"
summary = "Something you could actually do, with steps."

[types.wiki.variants.connection]
folder = "wiki/connections"
template = "wiki-connection.md"
summary = "A link between two domains that neither page would state alone."

[types.output]
folder = "outputs"
filename = "dated"
variant_field = "output_type"        # the variant name is also written to this field
required = ["type", "output_type", "title", "date", "tags"]
optional = ["projects", "areas", "people", "aliases"]
summary = "Something you or an agent produced: an answer, a decision, a review."

# An answer worth keeping: a question, researched, with citations.
[types.output.variants.answer]
folder = "outputs/answers"
template = "output-answer.md"
required = ["query", "sources_consulted"]
non_empty = ["sources_consulted"]
summary = "A researched answer with citations."

# A choice with options and consequences, revisited later to learn from it.
[types.output.variants.decision]
folder = "outputs/decisions"
template = "output-decision.md"
required = ["status", "outcome"]
optional = ["stakes", "review_on"]
summary = "A choice with options and consequences, reviewed later."
[types.output.variants.decision.enums]
status = ["pending", "decided", "superseded"]
outcome = ["unknown", "good", "bad", "mixed"]
stakes = ["low", "medium", "high"]

[types.output.variants.review]
folder = "outputs/reviews"
filename = "week"
template = "weekly-review.md"
optional = ["period"]
summary = "A periodic review scaffolded from vault facts."

[types.log]
folder = "logs"
filename = "log"
template = "log.md"
immutable = true
required = ["type", "date", "run_type", "tags"]
optional = []
summary = "One agent run. Append-only audit trail."
[types.log.enums]
run_type = ["ingest", "tidy", "reflect", "review", "other"]

# ─────────────────────────────────────────────────────────────── security

[security]
# Agent writes are confined to [paths].content_dirs. Deliberate human edits to
# system files require this env var (LIFEOS_ALLOW_SYSTEM_WRITES=1).
# Scheduled or unattended runs must NEVER set it.
guard_writes = true

# Files an agent reads as instructions, and directories whose contents are loaded
# as instructions or executed. Blocked at EVERY depth — agents load nested
# instruction files on demand, so `inbox/AGENTS.md` would be an injection path,
# and `.github/` can execute code on push.
instruction_files = ["AGENTS.md", "CLAUDE.md", "CLAUDE.local.md", ".cursorrules"]
instruction_dirs = [".claude", ".cursor", ".github"]

# Egress: scripts/fetch_url.py is the only sanctioned fetch path. It refuses
# loopback, private, link-local, CGNAT, and cloud-metadata hosts.
# Set allowlist_only = true to additionally refuse any host not listed below.
allowlist_only = false
publisher_allowlist = []

# Some corporate networks and VPNs run a transparent proxy that resolves public
# hostnames into 198.18.0.0/15. That range is blocked by default. If you are on
# such a network, set this to true — you are asserting the range is safe for you.
allow_benchmark_range = false

# ─────────────────────────────────────────────────────────────── retrieval

[retrieval]
# BM25 lexical search is stdlib and always available.
# Dense embeddings are optional (pip install -r requirements.txt) and strictly
# additive: retrieval degrades to BM25 alone when they are absent.
dense_enabled = false
# One hop through backlinks pulls in neighbours of strong matches.
backlink_hop = true
default_k = 10
